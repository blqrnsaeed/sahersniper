name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build SaherSniper APK
        run: |
          git clone --depth 1 https://github.com app_src
          mkdir -p app_src/assets/models
          cp best.tflite app_src/assets/models/best.tflite
          wget -q https://googleapis.com
          tar -xf flutter_linux_3.24.5-stable.tar.xz
          export PATH="$PATH:`pwd`/flutter/bin"
          cd app_src && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SaherSniper-APK
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
