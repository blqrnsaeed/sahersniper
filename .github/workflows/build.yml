name: Build SaherSniper APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android App & Build APK
        run: |
          python3 - << 'EOF'
          import os, shutil
          base = "SaherSniperApp"
          for d in ["app/src/main/java/com/saher/sniper", "app/src/main/res/layout", "app/src/main/assets"]:
              os.makedirs(f"{base}/{d}", exist_ok=True)
          shutil.copy("best.tflite", f"{base}/app/src/main/assets/best.tflite")

          open(f"{base}/settings.gradle", "w").write('''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SaherSniper"
          include ":app"
          ''')

          open(f"{base}/build.gradle", "w").write('''
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          ''')

          open(f"{base}/gradle.properties", "w").write("android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n")

          open(f"{base}/app/build.gradle", "w").write('''
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.saher.sniper"
              compileSdk 34
              defaultConfig {
                  applicationId "com.saher.sniper"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              aaptOptions { noCompress "tflite" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.camera:camera-core:1.3.1"
              implementation "androidx.camera:camera-camera2:1.3.1"
              implementation "androidx.camera:camera-lifecycle:1.3.1"
              implementation "androidx.camera:camera-view:1.3.1"
              implementation "org.tensorflow:tensorflow-lite:2.14.0"
          }
          ''')

          open(f"{base}/app/src/main/AndroidManifest.xml", "w").write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.hardware.camera" android:required="true"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <application android:label="قناص ساهر" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          open(f"{base}/app/src/main/res/layout/activity_main.xml", "w").write('''<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://android.com"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="#000000" android:keepScreenOn="true">
              <androidx.camera.view.PreviewView android:id="@+id/previewView"
                  android:layout_width="match_parent" android:layout_height="match_parent"/>
              <com.saher.sniper.OverlayView android:id="@+id/overlayView"
                  android:layout_width="match_parent" android:layout_height="match_parent"/>
              <TextView android:id="@+id/statusBanner"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="top" android:background="#AA000000"
                  android:gravity="center" android:padding="14dp"
                  android:text="🟢 القناص نشط" android:textColor="#00FF88"
                  android:textSize="20sp" android:textStyle="bold"/>
              <LinearLayout android:id="@+id/controlsLayout"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:layout_gravity="bottom" android:background="#AA000000"
                  android:orientation="horizontal" android:padding="12dp">
                  <Button android:id="@+id/btnMute" android:layout_width="0dp"
                      android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="🔇 كتم 10ث"/>
                  <Button android:id="@+id/btnPip" android:layout_width="0dp"
                      android:layout_height="wrap_content" android:layout_weight="1"
                      android:text="🪟 نافذة عائمة"/>
              </LinearLayout>
          </FrameLayout>
          ''')

          open(f"{base}/app/src/main/java/com/saher/sniper/OverlayView.kt", "w").write('''package com.saher.sniper
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View

          class OverlayView(c: Context, a: AttributeSet?) : View(c, a) {
              private var boxes = emptyList<RectF>()
              private var confs = emptyList<Float>()
              private val bp = Paint().apply { color = Color.RED; style = Paint.Style.STROKE; strokeWidth = 8f }
              private val tp = Paint().apply { color = Color.YELLOW; textSize = 48f; typeface = Typeface.DEFAULT_BOLD }

              fun updateDetections(b: List<RectF>, cf: List<Float>) {
                  boxes = b; confs = cf; postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  for (i in boxes.indices) {
                      val r = boxes[i]
                      val rect = RectF(r.left * width, r.top * height, r.right * width, r.bottom * height)
                      canvas.drawRect(rect, bp)
                      canvas.drawText("ساهر ${(confs[i]*100).toInt()}%", rect.left, maxOf(60f, rect.top - 12f), tp)
                  }
              }
          }
          ''')

          open(f"{base}/app/src/main/java/com/saher/sniper/MainActivity.kt", "w").write('''package com.saher.sniper
          import android.Manifest
          import android.app.PictureInPictureParams
          import android.content.Context
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.*
          import android.media.*
          import android.os.*
          import android.speech.tts.TextToSpeech
          import android.util.Rational
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.tensorflow.lite.Interpreter
          import java.io.FileInputStream
          import java.nio.*
          import java.nio.channels.FileChannel
          import java.util.*
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {
              private lateinit var previewView: PreviewView
              private lateinit var overlayView: OverlayView
              private lateinit var statusBanner: TextView
              private lateinit var controlsLayout: LinearLayout
              private var interpreter: Interpreter? = null
              private var tts: TextToSpeech? = null
              private var toneGen: ToneGenerator? = null
              private val exec = Executors.newSingleThreadExecutor()
              private var hits = 0
              private var lastAlert = 0L
              private var mutedUntil = 0L
              private var inputSize = 512

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContentView(R.layout.activity_main)
                  previewView = findViewById(R.id.previewView)
                  overlayView = findViewById(R.id.overlayView)
                  statusBanner = findViewById(R.id.statusBanner)
                  controlsLayout = findViewById(R.id.controlsLayout)
                  toneGen = ToneGenerator(AudioManager.STREAM_ALARM, 100)
                  tts = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) tts?.language = Locale("ar") }
                  findViewById<Button>(R.id.btnMute).setOnClickListener {
                      mutedUntil = System.currentTimeMillis() + 10000L
                      statusBanner.text = "🔇 مكتوم 10ث"
                  }
                  findViewById<Button>(R.id.btnPip).setOnClickListener { enterPip() }
                  loadModel()
